name: android-wrapper

# Builds the Android app (android/): a Trusted Web Activity
# that opens the site. Run by hand to make a signed build to
# install or publish; a pull request that touches the wrapper
# gets a debug build, so that a broken one is caught before
# it is merged. The Forgejo port of
# .github/workflows/android.yml; the job runs in the Gradle
# image the GitLab job used, which carries Java 17 and
# Gradle but no Android SDK and no Node, so both are
# installed first.
on:
  workflow_dispatch:
    inputs:
      host:
        description: The site the app opens (default evesynapse.app)
        required: false
      package:
        description: The app's package name (default app.evesynapse.twa)
        required: false
  pull_request:
    paths:
      - android/**
      - .forgejo/workflows/android.yml

jobs:
  build:
    runs-on: ubuntu-latest
    container: gradle:8.11.1-jdk17
    # The SDK step installs the platform here; the location
    # is job-level state because a step's own exports do not
    # reach the steps after it, and the build step's Gradle
    # looks for the SDK at ANDROID_HOME.
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      # The JavaScript actions (checkout, upload-artifact)
      # run on Node, which the Gradle image does not carry;
      # without it the job dies at checkout before Gradle
      # ever runs. Installed the way the GitLab job installs
      # it, before the first action step needs it.
      - name: Install Node for the actions
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl xz-utils >/dev/null
          curl -fsSL "https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-$(uname -m | sed -e 's/aarch64/arm64/' -e 's/x86_64/x64/').tar.xz" | tar -xJ -C /usr/local --strip-components=1
          node --version

      - name: Check out the source
        uses: actions/checkout@v4

      # The Gradle image carries no Android SDK (GitHub's
      # runners provided one); install the platform this app
      # compiles against (compileSdk 36).
      - name: Install the Android SDK platform
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip >/dev/null
          export ANDROID_HOME=/opt/android-sdk ANDROID_SDK_ROOT=/opt/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Google ships the SDK's native tools (aapt2, aidl,
      # zipalign) as x86_64 binaries only, with no ARM build
      # at any version, so on an ARM runner they cannot run
      # at all. The runner host carries a qemu registration
      # for x86_64, which runs them emulated once qemu can
      # find their loader and libraries: lay down an amd64
      # runtime root and point qemu at it for the steps
      # after this one. A no-op on x86_64 runners, where
      # the tools run natively.
      - name: Provide an x86_64 runtime for the SDK tools on ARM
        run: |
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "Not an ARM runner: the SDK tools run natively, nothing to do."
            exit 0
          fi
          sed -i 's/^deb /deb [arch=arm64] /' /etc/apt/sources.list
          printf 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe\ndeb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe\n' >> /etc/apt/sources.list
          dpkg --add-architecture amd64
          apt-get update -qq
          mkdir -p /tmp/x86debs /opt/x86_64-root
          (cd /tmp/x86debs && apt-get download libc6:amd64 libstdc++6:amd64 libgcc-s1:amd64 zlib1g:amd64)
          for d in /tmp/x86debs/*.deb; do dpkg-deb -x "$d" /opt/x86_64-root; done
          # The package's loader path is an absolute symlink
          # out of the root, which qemu follows to the host's
          # root and finds nothing. Give the root a real
          # loader file at that path instead.
          rm /opt/x86_64-root/lib64/ld-linux-x86-64.so.2
          cp /opt/x86_64-root/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /opt/x86_64-root/lib64/ld-linux-x86-64.so.2
          echo "QEMU_LD_PREFIX=/opt/x86_64-root" >> "$GITHUB_ENV"

      # The signing key is used only for a build somebody
      # asked for by hand, never for a pull request's. The
      # secret names match the GitLab variables:
      # ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS.
      - name: Build
        working-directory: android
        env:
          TWA_HOST: ${{ inputs.host }}
          TWA_PACKAGE: ${{ inputs.package }}
          KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_B64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          args=(--no-daemon)
          if [ -n "$TWA_HOST" ]; then args+=("-PtwaHost=$TWA_HOST"); fi
          if [ -n "$TWA_PACKAGE" ]; then args+=("-PtwaPackage=$TWA_PACKAGE"); fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
            # Read the key the way the build will, and say
            # plainly what is wrong with it: Gradle's own
            # message does not.
            alias="${ANDROID_KEY_ALIAS:-evesynapse}"
            if ! found="$(keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$alias" 2>&1)"; then
              echo "::error::The signing key could not be read: $(printf '%s' "$found" | head -n 2 | tr '\n' ' ')"
              echo "The key store is $(wc -c < "$ANDROID_KEYSTORE_FILE") bytes and starts with:$(head -c 4 "$ANDROID_KEYSTORE_FILE" | od -An -tx1) (a PKCS12 file starts with 30 82)."
              echo "It has to be the android.p12 from the README, base64-encoded, with its password in ANDROID_KEYSTORE_PASSWORD and its key named \"$alias\"."
              exit 1
            fi
            if ! printf '%s' "$found" | grep -q PrivateKeyEntry; then
              echo "::error::The key store has \"$alias\" but no private key under it: it holds only the certificate. Make android.p12 again with both -inkey and -in."
              exit 1
            fi
            gradle "${args[@]}" --stacktrace assembleRelease bundleRelease
            store="$ANDROID_KEYSTORE_FILE"; pass="$ANDROID_KEYSTORE_PASSWORD"; kind="release"
          else
            gradle "${args[@]}" assembleDebug
            store="$HOME/.android/debug.keystore"; pass="android"; kind="debug (a throwaway key: the app opens the site with the address bar showing)"
          fi
          echo "Android build: $kind"
          echo "Certificate fingerprint, for the site's ANDROID_APP_FINGERPRINTS:"
          keytool -list -v -keystore "$store" -storepass "$pass" 2>/dev/null | grep -m1 'SHA256:' | sed 's/^[[:space:]]*SHA256:[[:space:]]*//'

      - name: Remove the key store
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Keep the build
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: evesynapse-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
