# EveSynapse releases on Forgejo Actions: the Forgejo port of
# the GitLab release and mirror jobs (.gitlab-ci.yml). A dispatch
# from the GitHub gates, or a manual one, builds both architectures, signs
# the manifests and the release tag, and publishes the release here; a follow-on
# job then creates the same release on GitHub and GitLab, and the mirror
# job copies the same signed files to the R2 mirror the
# updater reads as its last resort.
#
# Publishing rules, the same as the GitLab pipeline's: a
# version publishes once (an existing release is left as it
# is); plain versions publish from main only, a suffixed
# version (0.4.1.4-dev) publishes from the dev branch and is
# reached with `evesynapse -update -dev`; nothing publishes
# unsigned. The release object is the commit point the
# updater reads: it is created as a draft, the six assets are
# uploaded to it, and only then is it published, so no reader
# ever sees a release whose files are not all there.
#
# The check gates (test, race, core-only, analysis) run on
# GitHub's runners, and the heavy-gates workflow there
# dispatches this workflow once its blocking gates pass on a
# release branch, so a release never ships on a tree those
# gates have not passed; analysis stays advisory, as it was
# when it ran here. This workflow only builds and publishes.

name: release

on:
  workflow_dispatch:

# One release per branch at a time: two pushes in quick
# succession must not both try to create the same release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/gomod

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    env:
      FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
      FORGEJO_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Go builds and modules
        uses: actions/cache@v4
        with:
          path: |
            .cache/go-build
            .cache/gomod
            .cache/dl
          key: go-${{ hashFiles('go.sum') }}
      - name: Install Go
        run: |
          case "$(uname -m)" in
            aarch64) go_arch=arm64; go_sum="a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49" ;;
            *) go_arch=amd64; go_sum="65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40" ;;
          esac
          mkdir -p .cache/dl
          if [ ! -f .cache/dl/go.tar.gz ]; then
            curl -fsSL -o .cache/dl/go.tar.gz "https://go.dev/dl/go1.27.3.linux-${go_arch}.tar.gz"
          fi
          echo "$go_sum  .cache/dl/go.tar.gz" | sha256sum -c -
          tar -xzf .cache/dl/go.tar.gz -C /usr/local
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version
      - name: Install the toolbox
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates git make python3 >/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the release files
        run: |
          make assets
          VERSION="$(tr -d '[:space:]' < internal/app/version.txt)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/evesynapse-arm64 ./cmd/evesynapse
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/evesynapse-amd64 ./cmd/evesynapse
          cd dist
          for a in arm64 amd64; do
            sha=$(sha256sum "evesynapse-$a" | cut -d' ' -f1)
            printf '{"version":"%s","arch":"%s","sha256":"%s"}\n' "$VERSION" "$a" "$sha" > "latest-$a.json"
          done
      # A version carrying a suffix (0.4.1.4-dev) is a
      # development build, reached with `evesynapse -update
      # -dev`. Plain versions are releases and are only ever
      # published from main, so another branch can't claim a
      # release's tag first. A version publishes once: when the
      # release exists, the push published nothing.
      - name: Decide whether this push publishes
        id: decide
        run: |
          publish=true
          if [ "$VERSION" = "${VERSION%%-*}" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Not publishing: $GITHUB_REF_NAME carries the plain version $VERSION, and plain versions are released from main only. Give this branch a suffixed version (for example $VERSION-dev) to publish development builds."
            publish=false
          fi
          if [ "$publish" = "true" ]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' --header "Authorization: token $FORGEJO_TOKEN" "$FORGEJO_API/releases/tags/v$VERSION")"
            if [ "$code" = "200" ]; then
              echo "Release v$VERSION already exists; leaving it as it is."
              publish=false
            elif [ "$code" != "404" ]; then
              echo "The releases API answered $code; not publishing on a guess."
              exit 1
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Only a signed release is published. The step fails, and
      # nothing is published, when the key is missing or is not
      # the other half of a key listed in
      # internal/releasesig/trusted_keys.pem. The secret holds
      # the key base64-encoded and releasesign reads it in that
      # form; a value that is a path to a file is read from that
      # file instead, as in the GitLab job.
      - name: Sign the manifests
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ "${{ steps.decide.outputs.publish }}" != "true" ]; then echo "Nothing to sign."; exit 0; fi
          if [ -n "$RELEASE_SIGNING_KEY" ] && [ -f "$RELEASE_SIGNING_KEY" ]; then
            RELEASE_SIGNING_KEY="$(cat "$RELEASE_SIGNING_KEY")"
            export RELEASE_SIGNING_KEY
          fi
          go run ./cmd/releasesign sign dist/latest-arm64.json dist/latest-amd64.json
      # The release notes: the pull requests merged since the
      # previous release, grouped by label the way
      # .github/release.yml groups them.
      - name: Write the release notes
        run: |
          if [ "${{ steps.decide.outputs.publish }}" != "true" ]; then echo "No notes to write."; exit 0; fi
          HOW="evesynapse -update -arm64 (or -x86, -amd64, -x64 on Intel/AMD computers)"
          if [ "$VERSION" != "${VERSION%%-*}" ]; then HOW="evesynapse -update -dev"; fi
          printf 'Automated build of EveSynapse v%s. Update with: %s.\n' "$VERSION" "$HOW" > release-notes.md
          python3 - <<'PYEOF'
          import json, os, urllib.request

          api = os.environ["FORGEJO_API"]
          token = os.environ["FORGEJO_TOKEN"]
          version = os.environ["VERSION"]

          def get(path):
              req = urllib.request.Request(api + path,
                                           headers={"Authorization": "token " + token,
                                                    "User-Agent": "evesynapse-release-workflow"})
              return json.load(urllib.request.urlopen(req))

          def vkey(tag):
              parts = []
              for piece in tag.lstrip("v").split("-")[0].split("."):
                  parts.append(int(piece) if piece.isdigit() else 0)
              return parts

          releases = get("/releases?limit=100")
          others = [r for r in releases if r["tag_name"] != "v" + version]
          since = None
          if others:
              prev = max(others, key=lambda r: vkey(r["tag_name"]))
              since = prev.get("published_at") or prev.get("created_at")
          merged = [p for p in get("/pulls?state=closed&limit=100&sort=updated&order=desc")
                    if p.get("merged")]
          cats = [("🚀 Features", {"feature", "enhancement"}),
                  ("🐛 Bug Fixes", {"fix", "bug"}),
                  ("🧰 Maintenance & Dependencies", {"chore", "dependencies"}),
                  ("Other Changes", None)]
          groups = {name: [] for name, _ in cats}
          for pr in merged:
              if since and (pr.get("merged_at") or "") <= since:
                  continue
              labels = {l["name"] for l in pr.get("labels") or []}
              for name, wanted in cats:
                  if wanted is None or labels & wanted:
                      groups[name].append(pr)
                      break
          notes = []
          for name, _ in cats:
              if not groups[name]:
                  continue
              notes.append("### " + name)
              for pr in groups[name]:
                  notes.append("* %s by @%s in #%s" % (pr["title"], pr["user"]["login"], pr["number"]))
              notes.append("")
          if notes:
              with open("release-notes.md", "a") as fh:
                  fh.write("\n## What's Changed\n\n" + "\n".join(notes))
          PYEOF
      # The release is created as a draft, the six files are
      # uploaded to it, and then it is published: the publish
      # is the commit point, and the updater skips drafts, so
      # no reader can see a half-uploaded release.
      # The release tag is made here, before the release is
      # created on it: a signed annotated tag, signed by the
      # release key in the OpenSSH form git signs with, authored
      # by the key's owner. Publishing then attaches the release
      # to this tag instead of the API minting an unsigned
      # lightweight one. A tag a died run left behind is reused
      # when it is this commit's signed tag, and stops the run
      # when it is anything else.
      - name: Sign the release tag
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ "${{ steps.decide.outputs.publish }}" != "true" ]; then echo "No tag to sign."; exit 0; fi
          if [ -n "$RELEASE_SIGNING_KEY" ] && [ -f "$RELEASE_SIGNING_KEY" ]; then
            RELEASE_SIGNING_KEY="$(cat "$RELEASE_SIGNING_KEY")"
            export RELEASE_SIGNING_KEY
          fi
          go run ./cmd/releasesign openssh -out "$RUNNER_TEMP/release-key"
          printf 'nate@evesynapse.app %s\n' "$(cat "$RUNNER_TEMP/release-key.pub")" > "$RUNNER_TEMP/allowed-signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed-signers"
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            if [ "$(git cat-file -t "v$VERSION")" = "tag" ] && [ "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA" ] && git tag -v "v$VERSION" >/dev/null 2>&1; then
              echo "The signed tag v$VERSION is already pushed for this commit; reusing it."
              exit 0
            fi
            echo "A tag v$VERSION already exists and is not the signed tag for this commit; not publishing over it."
            exit 1
          fi
          git config user.name "Nate"
          git config user.email "nate@evesynapse.app"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/release-key"
          git tag -s "v$VERSION" -m "EveSynapse v$VERSION" "$GITHUB_SHA"
          git tag -v "v$VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Publish the release
        run: |
          if [ "${{ steps.decide.outputs.publish }}" != "true" ]; then echo "No release to create."; exit 0; fi
          if [ "$VERSION" != "${VERSION%%-*}" ]; then PRERELEASE=true; else PRERELEASE=false; fi
          export PRERELEASE
          python3 - <<'PYEOF'
          import json, os, urllib.request

          api = os.environ["FORGEJO_API"]
          version = os.environ["VERSION"]
          body = {
              "tag_name": "v" + version,
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": "EveSynapse v" + version,
              "body": open("release-notes.md").read(),
              "draft": True,
              "prerelease": os.environ["PRERELEASE"] == "true",
          }
          req = urllib.request.Request(
              api + "/releases", data=json.dumps(body).encode(), method="POST",
              headers={"Authorization": "token " + os.environ["FORGEJO_TOKEN"],
                       "Content-Type": "application/json",
                       "User-Agent": "evesynapse-release-workflow"})
          rel = json.load(urllib.request.urlopen(req))
          with open("release-id.txt", "w") as fh:
              fh.write(str(rel["id"]))
          print("Draft release v%s created (id %s)." % (version, rel["id"]))
          PYEOF
          REL_ID="$(cat release-id.txt)"
          for f in evesynapse-arm64 evesynapse-amd64 latest-arm64.json latest-amd64.json latest-arm64.json.sig latest-amd64.json.sig; do
            curl -fsS --header "Authorization: token $FORGEJO_TOKEN" \
              -F "attachment=@dist/$f" \
              "$FORGEJO_API/releases/$REL_ID/assets?name=$f" > /dev/null
            echo "$f: uploaded."
          done
          curl -fsS -X PATCH --header "Authorization: token $FORGEJO_TOKEN" \
            --header "Content-Type: application/json" \
            -d '{"draft": false}' \
            "$FORGEJO_API/releases/$REL_ID" > /dev/null
          echo "Release v$VERSION published."
      - name: Add the release notes to the kept files
        if: steps.decide.outputs.publish == 'true'
        run: cp release-notes.md dist/release-notes.md
      - name: Keep the built files for the follow-on jobs
        if: steps.decide.outputs.publish == 'true'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Every published release is mirrored to the project's own
  # static mirror (a Cloudflare R2 bucket served from
  # cdn.synap6.io), which the updater reads when an install
  # names the mirror provider, and as the default chain's last
  # resort. The mirror carries the release's own signed
  # manifests, so an updater trusting the mirror trusts exactly
  # what it trusts from any provider: the signature, not the
  # host. Files land in the same order the updater relies on —
  # the version's archive first, the channel's binaries next,
  # and the channel pointer manifests last, so a pointer never
  # names a file that is not there yet. The R2 secrets are the
  # maintainer's to set; without them, and on any mirror
  # failure, the job reports and steps aside — the release
  # itself is already published by then, and a mirror problem
  # must not fail its pipeline.
  mirror:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.publish == 'true'
    continue-on-error: true
    env:
      VERSION: ${{ needs.release.outputs.version }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Fetch the built files
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the AWS CLI
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates unzip >/dev/null
          case "$(uname -m)" in
            aarch64) aws_arch=aarch64 ;;
            *) aws_arch=x86_64 ;;
          esac
          curl -fsSL -o /tmp/awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          aws --version
      - name: Mirror the release to R2
        run: |
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "The R2 mirror secrets are not set; skipping the mirror."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          FILES="evesynapse-arm64 evesynapse-amd64 latest-arm64.json latest-amd64.json latest-arm64.json.sig latest-amd64.json.sig"
          for f in $FILES; do
            aws s3 cp "dist/$f" "s3://$R2_BUCKET/evesynapse/v$VERSION/$f" --endpoint-url "$EP"
          done
          if [ "$VERSION" = "${VERSION%%-*}" ]; then CH="latest"; else CH="latest-dev"; fi
          for a in arm64 amd64; do
            aws s3 cp "dist/evesynapse-$a" "s3://$R2_BUCKET/$CH/evesynapse-$a" --endpoint-url "$EP"
          done
          for a in arm64 amd64; do
            aws s3 cp "dist/latest-$a.json" "s3://$R2_BUCKET/$CH-$a.json" --endpoint-url "$EP" --content-type "application/json"
            aws s3 cp "dist/latest-$a.json.sig" "s3://$R2_BUCKET/$CH-$a.json.sig" --endpoint-url "$EP"
          done
          echo "Mirrored v$VERSION to the $CH channel."

  # Every published release is also created on GitHub and
  # GitLab, under the signed tag the push mirrors already
  # carried there, with the same release notes and the same
  # six signed files, so the updater finds the same release
  # whichever forge it asks. The GitHub release is created as
  # a draft, filled, and then published, the commit point the
  # Forgejo publish uses; the GitLab leg uploads the files to
  # the project's Generic Package Registry first and creates
  # the Release last, the shape .gitlab-ci.yml's release job
  # uses, with the asset links named for the files they serve
  # because the updater matches them by name. An existing
  # release on either forge is left as it is, the rule the
  # Forgejo publish follows. Each leg is gated on its token
  # secret (GH_TOKEN, GL_TOKEN), the way the mirror
  # job is gated on its R2 secrets: without one, the leg logs
  # that it is skipped and steps aside. A leg that fails logs
  # it and fails only its own step — the Forgejo release is
  # already published by then, and trouble copying it must
  # not fail its pipeline.
  forges:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.publish == 'true'
    continue-on-error: true
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GL_TOKEN }}
    steps:
      - name: Fetch the built files
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the toolbox
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates python3 >/dev/null
      - name: Create the GitHub release
        continue-on-error: true
        run: |
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "The GH_TOKEN secret is not set; skipping the GitHub release."
            exit 0
          fi
          if [ "$VERSION" != "${VERSION%%-*}" ]; then PRERELEASE=true; else PRERELEASE=false; fi
          export PRERELEASE
          python3 - <<'PYEOF' || { echo "The GitHub release leg FAILED; the Forgejo release stands. See the error above."; exit 1; }
          import json, os, urllib.request

          api = "https://api.github.com/repos/natemsz/evesynapse"
          version = os.environ["VERSION"]
          tag = "v" + version
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "evesynapse-release-workflow"}

          def call(method, url, data=None, content_type=None):
              h = dict(headers)
              if content_type:
                  h["Content-Type"] = content_type
              req = urllib.request.Request(url, data=data, method=method, headers=h)
              return urllib.request.urlopen(req)

          rel = None
          with call("GET", api + "/releases?per_page=100") as resp:
              for r in json.load(resp):
                  if r.get("tag_name") == tag:
                      rel = r
                      break
          if rel is not None:
              print("Release %s already exists on GitHub; reusing it." % tag)
          else:
              body = {"tag_name": tag,
                      "name": "EveSynapse v" + version,
                      "body": open("dist/release-notes.md").read(),
                      "draft": True,
                      "prerelease": os.environ["PRERELEASE"] == "true"}
              with call("POST", api + "/releases",
                        data=json.dumps(body).encode(),
                        content_type="application/json") as resp:
                  rel = json.load(resp)
              print("Draft release %s created on GitHub (id %s)." % (tag, rel["id"]))
          upload_base = rel["upload_url"].split("{")[0]
          have = {a["name"] for a in rel.get("assets") or []}
          files = ["evesynapse-arm64", "evesynapse-amd64",
                   "latest-arm64.json", "latest-amd64.json",
                   "latest-arm64.json.sig", "latest-amd64.json.sig"]
          for f in files:
              if f in have:
                  print("%s: already on the GitHub release; skipping." % f)
                  continue
              with open("dist/" + f, "rb") as fh:
                  payload = fh.read()
              with call("POST", upload_base + "?name=" + f, data=payload,
                        content_type="application/octet-stream") as resp:
                  resp.read()
              print("%s: uploaded." % f)
          if rel.get("draft"):
              with call("PATCH", api + "/releases/" + str(rel["id"]),
                        data=json.dumps({"draft": False}).encode(),
                        content_type="application/json") as resp:
                  resp.read()
              print("Release %s published on GitHub." % tag)
          PYEOF
      - name: Create the GitLab release
        continue-on-error: true
        run: |
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "The GL_TOKEN secret is not set; skipping the GitLab release."
            exit 0
          fi
          GL_API="https://gitlab.com/api/v4"
          GL_PROJECT="natemsz%2Fevesynapse"
          code="$(curl -s -o /dev/null -w '%{http_code}' --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$GL_API/projects/$GL_PROJECT/releases/v$VERSION")"
          if [ "$code" = "200" ]; then
            echo "Release v$VERSION already exists on GitLab; leaving it as it is."
            exit 0
          fi
          if [ "$code" != "404" ]; then
            echo "The GitLab releases API answered $code; not creating the release on a guess."
            exit 1
          fi
          PKG_BASE="$GL_API/projects/$GL_PROJECT/packages/generic/evesynapse/v$VERSION"
          existing="$(curl -fsS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$GL_API/projects/$GL_PROJECT/packages?package_type=generic&package_name=evesynapse&per_page=100" || echo '[]')"
          pkg_id="$(printf '%s' "$existing" | VERSION="$VERSION" python3 -c 'import json,os,sys; pkgs=json.load(sys.stdin); print(next((p["id"] for p in pkgs if p.get("version")=="v"+os.environ["VERSION"]), ""))')"
          declare -A have=()
          if [ -n "$pkg_id" ]; then
            files_json="$(curl -fsS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$GL_API/projects/$GL_PROJECT/packages/$pkg_id/package_files?per_page=100")"
            while IFS='=' read -r fname fsha; do
              [ -n "$fname" ] && have["$fname"]="$fsha"
            done < <(printf '%s' "$files_json" | python3 -c 'import json,sys; [print(f["file_name"]+"="+f["file_sha256"]) for f in json.load(sys.stdin)]')
          fi
          for f in evesynapse-arm64 evesynapse-amd64 latest-arm64.json latest-amd64.json latest-arm64.json.sig latest-amd64.json.sig; do
            sha="$(sha256sum "dist/$f" | cut -d' ' -f1)"
            if [ "${have[$f]:-}" = "$sha" ]; then
              echo "$f: already in the GitLab registry under the same hash; skipping."
              continue
            fi
            if [ -n "${have[$f]:-}" ]; then
              echo "$f: the GitLab registry holds a different build under this version; refusing to replace it."
              exit 1
            fi
            curl -fsS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --upload-file "dist/$f" "$PKG_BASE/$f"
            echo "$f: uploaded."
          done
          GL_API="$GL_API" GL_PROJECT="$GL_PROJECT" VERSION="$VERSION" GITHUB_SHA="$GITHUB_SHA" python3 - <<'PYEOF' || { echo "The GitLab release leg FAILED; the Forgejo release stands. See the error above."; exit 1; }
          import json, os, urllib.request

          version = os.environ["VERSION"]
          files = ["evesynapse-arm64", "evesynapse-amd64",
                   "latest-arm64.json", "latest-amd64.json",
                   "latest-arm64.json.sig", "latest-amd64.json.sig"]
          api = os.environ["GL_API"]
          project = os.environ["GL_PROJECT"]
          body = {
              "tag_name": "v" + version,
              "ref": os.environ["GITHUB_SHA"],
              "name": "EveSynapse v" + version,
              "description": open("dist/release-notes.md").read(),
              "assets": {"links": [
                  {"name": f, "url": "%s/projects/%s/packages/generic/evesynapse/v%s/%s" % (
                      api, project, version, f),
                   "direct_asset_path": "/" + f, "link_type": "package"}
                  for f in files]},
          }
          req = urllib.request.Request(
              api + "/projects/" + project + "/releases",
              data=json.dumps(body).encode(), method="POST",
              headers={"PRIVATE-TOKEN": os.environ["GITLAB_TOKEN"], "Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print("Release v%s created on GitLab." % version)
          PYEOF
