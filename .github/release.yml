# .github/release.yml
changelog:
  categories:
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "🧰 Maintenance & Dependencies"
      labels:
        - "chore"
        - "dependencies"
    - title: "Other Changes"
      labels:
        - "*"
