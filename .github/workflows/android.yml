name: android-wrapper

# Builds the Android app (android/): a Trusted Web Activity that opens
# the site. Run by hand to make a signed build to install or publish;
# a push that touches the wrapper gets a debug build, so that a broken
# one is caught before it is merged.
#
# The build runs on GitHub's runners, the way the other big builds do:
# Forgejo has no runner for ubuntu-latest, so the Forgejo port of this
# workflow waited for one that never came. The job reports its result
# back to Forgejo as a commit status, where the work is reviewed, and
# Forgejo then mirrors to GitLab and the cloud. The GitLab CI copy of
# this job stays as the dormant fallback.
on:
  push:
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      host:
        description: The site the app opens (default evesynapse.app)
        required: false
      package:
        description: The app's package name (default app.evesynapse.twa)
        required: false
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  build:
    # Forgejo also reads .github/workflows, so the job only runs on
    # GitHub itself and skips on Forgejo.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Use the runner's Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.2"

      # The signing key is used only for a build somebody asked for by
      # hand, never for a pull request's.
      - name: Build
        working-directory: android
        env:
          TWA_HOST: ${{ inputs.host }}
          TWA_PACKAGE: ${{ inputs.package }}
          KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          args=(--no-daemon)
          if [ -n "$TWA_HOST" ]; then args+=("-PtwaHost=$TWA_HOST"); fi
          if [ -n "$TWA_PACKAGE" ]; then args+=("-PtwaPackage=$TWA_PACKAGE"); fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
            # Read the key the way the build will, and say plainly what
            # is wrong with it: Gradle's own message does not.
            alias="${ANDROID_KEY_ALIAS:-evesynapse}"
            if ! found="$(keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$alias" 2>&1)"; then
              echo "::error::The signing key could not be read: $(printf '%s' "$found" | head -n 2 | tr '\n' ' ')"
              echo "The key store is $(wc -c < "$ANDROID_KEYSTORE_FILE") bytes and starts with:$(head -c 4 "$ANDROID_KEYSTORE_FILE" | od -An -tx1) (a PKCS12 file starts with 30 82)."
              echo "It has to be the android.p12 from the README, base64-encoded, with its password in ANDROID_KEYSTORE_PASSWORD and its key named \"$alias\"."
              exit 1
            fi
            if ! printf '%s' "$found" | grep -q PrivateKeyEntry; then
              echo "::error::The key store has \"$alias\" but no private key under it: it holds only the certificate. Make android.p12 again with both -inkey and -in."
              exit 1
            fi
            gradle "${args[@]}" --stacktrace assembleRelease bundleRelease
            store="$ANDROID_KEYSTORE_FILE"; pass="$ANDROID_KEYSTORE_PASSWORD"; kind="release"
          else
            gradle "${args[@]}" assembleDebug
            store="$HOME/.android/debug.keystore"; pass="android"; kind="debug (a throwaway key: the app opens the site with the address bar showing)"
          fi
          {
            echo "### Android build: $kind"
            echo
            echo "Certificate fingerprint, for the site's ANDROID_APP_FINGERPRINTS:"
            echo
            echo '```'
            keytool -list -v -keystore "$store" -storepass "$pass" 2>/dev/null | grep -m1 'SHA256:' | sed 's/^[[:space:]]*SHA256:[[:space:]]*//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key store
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evesynapse-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Report the result to Forgejo
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          case "${{ job.status }}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          curl -fsS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github/android\",\"description\":\"Android build on GitHub runners\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://natems.dev/api/v1/repos/EveSynapse/evesynapse/statuses/${{ github.sha }}"
