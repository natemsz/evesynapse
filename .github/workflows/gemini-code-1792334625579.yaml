name: Update CHANGELOG.md on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git tags and previous releases are discoverable
          fetch-depth: 0
          ref: main # Set to your default branch (e.g., 'main' or 'master')

      - name: Generate Release Notes via GitHub API
        id: generate_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          
          # Call GitHub's release notes generation endpoint
          NOTES=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG_NAME" \
            --jq '.body')

          # Save to multiline environment file safely
          {
            echo "RELEASE_TAG=$TAG_NAME"
            echo "RELEASE_BODY<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Prepend Notes to CHANGELOG.md
        run: |
          DATE=$(date +'%Y-%m-%d')
          TEMP_FILE=$(mktemp)

          # Format new release entry
          {
            echo "## [${RELEASE_TAG}] - ${DATE}"
            echo ""
            echo "${RELEASE_BODY}"
            echo ""
          } > "$TEMP_FILE"

          # Append existing CHANGELOG.md if present, or create header if missing
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.md >> "$TEMP_FILE"
          fi

          mv "$TEMP_FILE" CHANGELOG.md

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          
          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs(changelog): update CHANGELOG.md for ${RELEASE_TAG} [skip ci]"
            git push origin main
          fi