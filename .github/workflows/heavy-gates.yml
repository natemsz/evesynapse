# EveSynapse check gates on GitHub-hosted runners: all four
# of the project's check gates (test, race, core-only and
# analysis) run here, on GitHub's runners, so the project's
# app box only builds and publishes releases. When the three
# blocking gates pass on a release branch, the release-gate
# job below dispatches the release workflow on Forgejo,
# which only builds and publishes.
#
# Forgejo also reads .github/workflows, so every job carries a
# guard that only passes on GitHub itself; on Forgejo the jobs
# skip. Each job reports its result back to Forgejo as a
# commit status, so the verdict shows on the commit at
# natems.dev where the work is reviewed. The report steps and
# the release dispatch need a FORGEJO_TOKEN repository secret
# (a Forgejo token with repository write scope); without it
# the report steps fail softly, but the release-gate fails
# loudly, since a release that was never handed over must not
# read as a success.

name: heavy-gates

on:
  push:
  pull_request:

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      # The generated database code (internal/db/sqlc) must
      # match what the pinned sqlc makes of the schema and
      # queries: a hand-edit or a forgotten regenerate fails
      # here instead of drifting.
      - name: Check the generated database code is fresh
        run: |
          build="$(mktemp -d)"
          case "$(uname -m)" in
            aarch64) sqlc_arch=arm64; sqlc_sum="b7cae247740d0c51a1e657479e5b2d21e6fef428f596682a01bc55bf4ab8a23d" ;;
            *) sqlc_arch=amd64; sqlc_sum="497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354" ;;
          esac
          curl -fsSL -o "$build/sqlc.tar.gz" "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_${sqlc_arch}.tar.gz"
          echo "$sqlc_sum  $build/sqlc.tar.gz" | sha256sum -c -
          tar -xzf "$build/sqlc.tar.gz" -C "$build" sqlc
          "$build/sqlc" version
          "$build/sqlc" generate
          if ! git diff --exit-code internal/db/sqlc; then
            echo "internal/db/sqlc is stale: run 'sqlc generate' (sqlc v1.31.1) and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard internal/db/sqlc)"
          if [ -n "$untracked" ]; then
            echo "sqlc generate produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: Decode the embedded assets
        run: make assets
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run: make fmt):"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Run the test suite
        run: go test -timeout 20m ./...
      # File list is explicit, not a glob: node --test only
      # expands globs on Node 21+, and a quoted glob that
      # matches nothing would pass the step with zero tests
      # run. A missing file fails loudly instead.
      - name: Run the JavaScript tests
        run: >-
          node --test
          internal/app/jstest/swap.test.js
          internal/app/jstest/swap.browser.test.js
          internal/app/jstest/plan.firstload.test.js
          internal/app/jstest/pi.test.js
          internal/app/jstest/fit.tip.test.js
          internal/app/jstest/fit.loadoutpreview.test.js
          internal/app/jstest/fit.phoneviews.test.js
          internal/app/jstest/tabs.more.test.js
          internal/app/jstest/phonebar.test.js
          internal/app/jstest/map.test.js
          internal/app/jstest/dashboard.test.js
      - name: Report the result to Forgejo
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          case "${{ job.status }}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          curl -fsS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github/test\",\"description\":\"Test gate on GitHub runners\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://natems.dev/api/v1/repos/EveSynapse/evesynapse/statuses/${{ github.sha }}"

  race:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Decode the embedded assets
        run: make assets
      # Under the race detector internal/app takes 5-10
      # minutes: past go test's default 10m limit.
      - name: Run the test suite under the race detector
        run: go test -race -timeout 30m ./...
      - name: Report the result to Forgejo
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          case "${{ job.status }}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          curl -fsS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github/race\",\"description\":\"Race gate on GitHub runners\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://natems.dev/api/v1/repos/EveSynapse/evesynapse/statuses/${{ github.sha }}"

  core-only:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Decode the embedded assets
        run: make assets
      - name: Build and vet core-only
        run: |
          go build -tags core_only ./...
          go vet -tags core_only ./...
      - name: Run the core-only tests
        run: go test -tags core_only -timeout 20m -run 'TestCoreOnly' ./internal/app/
      # The module build tool: every module must compile and
      # vet on its own, with only what it declares.
      - name: Check every module builds on its own
        run: |
          go run ./cmd/modbuild -all -check
          for id in $(go run ./cmd/modbuild -ids); do
            go run ./cmd/modbuild -modules "$id" -write > /dev/null
            echo "== $id"
            go build ./cmd/evesynapse
            go vet ./internal/app/
          done
      - name: Report the result to Forgejo
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          case "${{ job.status }}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          curl -fsS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github/core-only\",\"description\":\"Core-only gate on GitHub runners\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://natems.dev/api/v1/repos/EveSynapse/evesynapse/statuses/${{ github.sha }}"

  # Static analysis and the known-vulnerability check.
  # Advisory, as in the Forgejo CI: a finding shows up on the
  # run without blocking a release.
  analysis:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Decode the embedded assets
        run: make assets
      # staticcheck is built against the newest
      # golang.org/x/tools, as in the Forgejo CI: the pinned
      # copy in its own release cannot read packages a newer
      # Go compiles.
      - name: Run staticcheck
        run: |
          build="$(mktemp -d)"
          (cd "$build" && go mod init staticcheck-build \
            && go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest \
            && go build -o staticcheck honnef.co/go/tools/cmd/staticcheck)
          "$build/staticcheck" ./...
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Report the result to Forgejo
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          case "${{ job.status }}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          curl -fsS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github/analysis\",\"description\":\"Analysis gate on GitHub runners\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://natems.dev/api/v1/repos/EveSynapse/evesynapse/statuses/${{ github.sha }}"
  # The gate for the release itself: once the three blocking
  # gates pass on a release branch, hand the release to
  # Forgejo, whose release workflow only builds and publishes.
  # A failed dispatch fails this job, so a release that was
  # never handed over never reads as green.
  release-gate:
    if: github.server_url == 'https://github.com' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/evesynapse-dev')
    runs-on: ubuntu-latest
    needs: [test, race, core-only]
    env:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
    steps:
      - name: Hand the release to Forgejo
        run: |
          code="$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}" \
            'https://natems.dev/api/v1/repos/EveSynapse/evesynapse/actions/workflows/release.yml/dispatches')"
          cat /tmp/dispatch.out
          if [ "$code" != "204" ]; then
            echo "Forgejo refused the release dispatch (HTTP $code)."
            exit 1
          fi
          echo "Release workflow dispatched on Forgejo for $GITHUB_REF_NAME."
