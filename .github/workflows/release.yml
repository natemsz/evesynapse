name: build-and-release

# Every push to main or evesynapse-dev, and every pull request, is
# checked. Only pushes go on to build and publish.
on:
  push:
    branches: [main, evesynapse-dev]
  pull_request:
  workflow_dispatch:

# Jobs get a read-only token. The release job alone asks for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit behind the version named
      # beside them; Dependabot keeps both up to date.
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Decode the embedded assets (fonts, wallpaper)
        run: make assets

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run: make fmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run the test suite
        run: go test ./...

  # The same suite under the race detector, as its own job so the
  # plain run above stays fast.
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Decode the embedded assets (fonts, wallpaper)
        run: make assets

      - name: Run the test suite with the race detector
        run: go test -race ./...

  # Static analysis and the known-vulnerability check. Advisory: a
  # finding shows up on the run without blocking a release, since
  # both tools gain new checks over time.
  analysis:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Decode the embedded assets (fonts, wallpaper)
        run: make assets

      # staticcheck is built here against the newest golang.org/x/tools
      # rather than run with "go run …@latest", which builds it against
      # the x/tools its own release pinned. That pinned copy cannot read
      # the packages a newer Go compiles (Go 1.27.2: "export data
      # version 5 is greater than maximum supported version 4"), and
      # then staticcheck stops before it has looked at any code.
      - name: staticcheck
        run: |
          build="$(mktemp -d)"
          (cd "$build" && go mod init staticcheck-build \
            && go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest \
            && go build -o staticcheck honnef.co/go/tools/cmd/staticcheck)
          "$build/staticcheck" ./...

      - name: govulncheck
        if: always()
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    # Only what passed the tests is built, and pull requests never
    # publish.
    needs: [test, race]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release job per branch at a time: two pushes in quick
    # succession must not both try to create the same release.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Decode the embedded assets (fonts, wallpaper)
        run: make assets

      - name: Read the version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < internal/app/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build both kinds
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/evesynapse-arm64 ./cmd/evesynapse
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/evesynapse-amd64 ./cmd/evesynapse

      - name: Write the update manifests
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          for a in arm64 amd64; do
            sha=$(sha256sum "evesynapse-$a" | cut -d' ' -f1)
            printf '{"version":"%s","arch":"%s","sha256":"%s"}\n' "$VERSION" "$a" "$sha" > "latest-$a.json"
          done

      # A version carrying a suffix (0.4.1.4-dev) is a development
      # build: it is published as a prerelease, which GitHub never
      # serves as "latest" — the address `evesynapse -update` reads —
      # and is reached with `evesynapse -update -dev` instead. Plain
      # versions are releases and are only ever published from main,
      # so another branch can't claim a release's tag first.
      - name: Decide whether this push publishes a release (once per version)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          publish=true
          if [ "$VERSION" = "${VERSION%%-*}" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Not publishing: $GITHUB_REF_NAME carries the plain version $VERSION, and plain versions are released from main only. Give this branch a suffixed version (for example $VERSION-dev) to publish development builds."
            publish=false
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it as it is."
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Only a signed release is published. `evesynapse -update`
      # installs nothing whose manifest is not signed by a release
      # key compiled into it, so each manifest is signed here with
      # that key's private half, the RELEASE_SIGNING_KEY secret. The
      # step fails, and nothing is published, when the secret is
      # missing or is not the other half of a key listed in
      # internal/releasesig/trusted_keys.pem. It runs only when there
      # is a release to publish: the key signs nothing else.
      - name: Sign the update manifests
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/releasesign sign dist/latest-arm64.json dist/latest-amd64.json

      - name: Publish the release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          channel_flag=""
          how="evesynapse -update -arm64 (or -x86, -amd64, -x64 on Intel/AMD computers)"
          if [ "$VERSION" != "${VERSION%%-*}" ]; then
            channel_flag="--prerelease"
            how="evesynapse -update -dev"
          fi
          gh release create "$tag" \
            dist/evesynapse-arm64 dist/evesynapse-amd64 \
            dist/latest-arm64.json dist/latest-amd64.json \
            dist/latest-arm64.json.sig dist/latest-amd64.json.sig \
            $channel_flag \
            --title "EveSynapse $tag" \
            --notes "Automated build of EveSynapse $tag. Update with: $how."
