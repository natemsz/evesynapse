name: build-and-release

# Every push to main or evesynapse-dev, and every pull request, is
# checked. Only pushes go on to build and publish.
on:
  push:
    branches: [main, evesynapse-dev]
  pull_request:
  workflow_dispatch:

# Jobs get a read-only token. The release job alone asks for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit behind the version named
      # beside them; Dependabot keeps both up to date.
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Decode the embedded assets (fonts, wallpaper)
        run: make assets

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run: make fmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run the test suite
        run: go test ./...

  # The same suite under the race detector, as its own job so the
  # plain run above stays fast.
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Decode the embedded assets (fonts, wallpaper)
        run: make assets

      - name: Run the test suite with the race detector
        run: go test -race ./...

  # Static analysis and the known-vulnerability check. Advisory: a
  # finding shows up on the run without blocking a release, since
  # both tools gain new checks over time.
  analysis:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Decode the embedded assets (fonts, wallpaper)
        run: make assets

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: govulncheck
        if: always()
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    # Only what passed the tests is built, and pull requests never
    # publish.
    needs: [test, race]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release job per branch at a time: two pushes in quick
    # succession must not both try to create the same release.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Decode the embedded assets (fonts, wallpaper)
        run: make assets

      - name: Read the version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < internal/app/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build both kinds
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/evesynapse-arm64 ./cmd/evesynapse
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/evesynapse-amd64 ./cmd/evesynapse

      - name: Write the update manifests
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          for a in arm64 amd64; do
            sha=$(sha256sum "evesynapse-$a" | cut -d' ' -f1)
            printf '{"version":"%s","arch":"%s","sha256":"%s"}\n' "$VERSION" "$a" "$sha" > "latest-$a.json"
          done

      # A version carrying a suffix (0.3.38.001-dev) is a development
      # build: it is published as a prerelease, which GitHub never
      # serves as "latest" — the address `evesynapse -update` reads —
      # and is reached with `evesynapse -update -dev` instead. Plain
      # versions are releases and are only ever published from main,
      # so another branch can't claim a release's tag first.
      - name: Publish the release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          channel_flag=""
          how="evesynapse -update -arm64 (or -x86, -amd64, -x64 on Intel/AMD computers)"
          if [ "$VERSION" != "${VERSION%%-*}" ]; then
            channel_flag="--prerelease"
            how="evesynapse -update -dev"
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Not publishing: $GITHUB_REF_NAME carries the plain version $VERSION, and plain versions are released from main only. Give this branch a suffixed version (for example $VERSION-dev) to publish development builds."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it as it is."
          else
            gh release create "$tag" \
              dist/evesynapse-arm64 dist/evesynapse-amd64 \
              dist/latest-arm64.json dist/latest-amd64.json \
              $channel_flag \
              --title "EveSynapse $tag" \
              --notes "Automated build of EveSynapse $tag. Update with: $how."
          fi
