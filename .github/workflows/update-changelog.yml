name: Update CHANGELOG.md on Release

# Trigger: workflow_run on the release workflow, NOT "release: published".
# Releases are published by the build-and-release workflow using
# GITHUB_TOKEN, and events caused by GITHUB_TOKEN do not start new
# workflow runs -- the old release trigger therefore never fired.
# workflow_run is the documented exception and fires regardless.
on:
  workflow_run:
    workflows: ["build-and-release"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    # Only a successful release run: its head branch is the version tag.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch the published release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script directly:
          # a branch/tag name is untrusted input to a shell.
          TAG_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          NOTES=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/tags/${TAG_NAME}" \
            --jq '.body')

          {
            echo "RELEASE_TAG=$TAG_NAME"
            echo "RELEASE_BODY<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Insert notes into CHANGELOG.md
        run: |
          DATE=$(date +'%Y-%m-%d')
          SECTION_FILE=$(mktemp)

          {
            echo "## [${RELEASE_TAG}] - ${DATE}"
            echo ""
            # The release body minus its HTML generator comment.
            echo "${RELEASE_BODY}" | grep -v '^<!--' || true
            echo ""
          } > "$SECTION_FILE"

          # Insert the new section after the [Unreleased] block:
          # immediately before the first existing version section.
          awk -v sec="$SECTION_FILE" '
            /^## \[v/ && !done {
              while ((getline line < sec) > 0) print line
              done = 1
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.new

          mv CHANGELOG.new CHANGELOG.md

      - name: Create Pull Request for Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(changelog): update for ${{ env.RELEASE_TAG }}"
          branch: "changelog-${{ env.RELEASE_TAG }}"
          delete-branch: true
          title: "docs(changelog): review changelog for ${{ env.RELEASE_TAG }}"
          body: |
            Automated changelog generation for release **${{ env.RELEASE_TAG }}**.

            ### Instructions:
            1. Review the changes to `CHANGELOG.md` in the Files Changed tab.
            2. Edit directly if any formatting or text requires adjustment.
            3. Merge when ready.
          base: main
