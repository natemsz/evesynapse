{{define "admintabs"}}<nav class="an-tabs" aria-label="Admin sections">
  <a class="an-tab{{if eq .AdminTab "analytics"}} is-active{{end}}" href="/admin/">Analytics</a>
  <a class="an-tab" href="/admin/#accounts">Accounts</a>
  <a class="an-tab" href="/admin/#access">Access</a>
  <a class="an-tab{{if eq .AdminTab "sync"}} is-active{{end}}" href="/admin/sync/">Sync</a>
  {{with .Admin}}{{with .Analytics}}<span class="an-range">{{range .Links}}{{if .Active}}<a class="is-active" href="/admin/?range={{.Key}}">{{.Label}}</a>{{else}}<a href="/admin/?range={{.Key}}">{{.Label}}</a>{{end}}{{end}}</span>{{end}}{{end}}
</nav>{{end}}
