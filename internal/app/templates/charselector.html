{{define "charselector"}}
{{if .}}
<div class="charselector" data-charselector>
  <input type="text" class="charselector-input" placeholder="Select character..." autocomplete="off" aria-label="Select character">
  <div class="charselector-dropdown" hidden>
    {{range .}}
    <a href="?character={{.ID}}" class="charselector-option{{if .Active}} active{{end}}" data-name="{{.Name}}" data-tags="{{.Tags}}" data-id="{{.ID}}">
      <span class="charselector-name">{{.Name}}</span>{{if .Tags}} <span class="charselector-tags">{{.Tags}}</span>{{end}}
    </a>
    {{end}}
  </div>
</div>
{{end}}
{{end}}
