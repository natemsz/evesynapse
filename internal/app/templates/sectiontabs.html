{{define "sectiontabs"}}{{with .SectionTabs}}<nav class="section-tabs" aria-label="Pages in this section">
  {{range .}}<a href="{{.Href}}"{{if .Active}} class="active" aria-current="page"{{end}}>{{.Label}}</a>{{end}}
</nav>{{end}}{{with .SectionSubTabs}}<nav class="section-subtabs" aria-label="Pages in this group">
  {{range .}}<a href="{{.Href}}"{{if .Active}} class="active" aria-current="page"{{end}}>{{.Label}}</a>{{end}}{{if $.SubTabNote}}<span class="subtab-note"><span class="subtab-dot" aria-hidden="true"></span>{{$.SubTabNote}}</span>{{end}}
</nav>{{end}}{{end}}
